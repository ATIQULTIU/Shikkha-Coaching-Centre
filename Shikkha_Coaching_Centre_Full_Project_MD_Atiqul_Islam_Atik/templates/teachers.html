{% extends "base.html" %}{% block content %}<div class="heading"><div><small>TEACHER CONTROL</small><h1>Teacher Management</h1></div><a class="btn" href="{{url_for('add_teacher')}}">+ Add Teacher</a></div><div class="cards">{% for t in teachers %}<div class="card"><h2>👨‍🏫 {{t.name}}</h2><p>{{t.subject}}</p><p>{{t.phone or "-"}} · {{t.qualification or "-"}}</p><em>{{t.status}}</em><div><a href="{{url_for('edit_teacher',id=t.id)}}">Edit</a> · <a href="{{url_for('delete_teacher',id=t.id)}}">Delete</a></div></div>{% else %}<div class="card">No teachers.</div>{% endfor %}</div>{% endblock %}
