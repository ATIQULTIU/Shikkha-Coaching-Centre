{% extends "base.html" %}{% block content %}<div class="heading"><h1>{% if batch %}Edit Batch{% else %}Create Batch{% endif %}</h1></div><div class="card"><form method="post"><div class="formgrid">{% for n,l in [('batch_code','Batch Code'),('name','Batch Name'),('subject','Subject'),('schedule','Schedule'),('room','Room'),('capacity','Capacity')] %}<label>{{l}}<input name="{{n}}" value="{{getattr(batch,n,'') if batch else (30 if n=='capacity' else '')}}" required></label>{% endfor %}<label>Teacher<select name="teacher_id"><option value="">Select</option>{% for t in teachers %}<option value="{{t.id}}">{{t.name}} — {{t.subject}}</option>{% endfor %}</select></label><label>Status<select name="status"><option>Active</option><option>Inactive</option></select></label></div><button class="btn">Save Batch</button></form></div>{% endblock %}
