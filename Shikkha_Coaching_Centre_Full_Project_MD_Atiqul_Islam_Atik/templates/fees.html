{% extends "base.html" %}{% block content %}<div class="heading"><h1>💰 Fee Management</h1><strong>Total: ৳{{"%.2f"|format(total_paid)}}</strong></div><div class="card"><form method="post"><div class="formgrid"><label>Student<select name="student_id" required>{% for s in students %}<option value="{{s.id}}">{{s.student_id}} — {{s.name}}</option>{% endfor %}</select></label><label>Amount<input type="number" step=".01" name="amount" required></label><label>Month<input name="month"></label><label>Date<input type="date" name="payment_date" value="{{today}}" required></label><label>Status<select name="status"><option>Paid</option><option>Pending</option></select></label><label>Note<input name="note"></label></div><button class="btn">Record Payment</button></form></div><div class="card"><table><tr><th>Student</th><th>Amount</th><th>Month</th><th>Date</th><th>Action</th></tr>{% for f in fees %}<tr><td>{{f.student.name}}</td><td>৳{{f.amount}}</td><td>{{f.month}}</td><td>{{f.payment_date}}</td><td><a href="{{url_for('delete_fee',id=f.id)}}">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}
