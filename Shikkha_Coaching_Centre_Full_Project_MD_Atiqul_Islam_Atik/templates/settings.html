{% extends "base.html" %}{% block content %}<div class="heading"><h1>⚙️ Admin Settings</h1></div><div class="card"><form method="post"><label>Username<input value="{{admin.username}}" readonly></label><label>Full Name<input name="full_name" value="{{admin.full_name}}" required></label><label>Email<input name="email" value="{{admin.email or ''}}"></label><hr><h3>Change Password</h3><label>Current Password<input type="password" name="current_password"></label><label>New Password<input type="password" name="new_password" minlength="6"></label><button class="btn">Save Settings</button></form></div>{% endblock %}
