{% extends "base.html" %}{% block content %}<div class="heading"><h1>Notices</h1><a class="btn" href="{{url_for('add_notice')}}">+ Publish Notice</a></div><div class="cards">{% for n in notices %}<div class="card"><h2>📢 {{n.title}}</h2><small>{{n.notice_type}} · {{n.created_at.strftime("%d %b %Y")}}</small><p>{{n.content}}</p><a href="{{url_for('edit_notice',id=n.id)}}">Edit</a> · <a href="{{url_for('delete_notice',id=n.id)}}">Delete</a></div>{% else %}<div class="card">No notices.</div>{% endfor %}</div>{% endblock %}
