{% extends "base.html" %}{% block content %}<div class="heading"><h1>{% if notice %}Edit Notice{% else %}Publish Notice{% endif %}</h1></div><div class="card"><form method="post"><label>Title<input name="title" value="{{notice.title if notice else ''}}" required></label><label>Type<select name="notice_type">{% for x in ['General','Exam','Holiday','Payment','Class','Emergency'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Content<textarea name="content" rows="8" required>{{notice.content if notice else ''}}</textarea></label>{% if notice %}<label><input type="checkbox" name="published" checked> Published</label>{% endif %}<button class="btn">Save Notice</button></form></div>{% endblock %}
