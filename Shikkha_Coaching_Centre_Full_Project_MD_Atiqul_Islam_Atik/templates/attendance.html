{% extends "base.html" %}{% block content %}<div class="heading"><h1>📝 Attendance</h1></div><div class="card"><form class="filters"><select name="batch_id"><option value="">Select Batch</option>{% for b in batches %}<option value="{{b.id}}" {% if selected_batch|string==b.id|string %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select><input type="date" name="date" value="{{selected_date}}"><button>Load</button></form></div>{% if students %}<div class="card"><form method="post"><input type="hidden" name="batch_id" value="{{selected_batch}}"><input type="hidden" name="attendance_date" value="{{selected_date}}">{% for s in students %}<div class="att"><b>{{s.name}}</b><span>{% for x in ['Present','Absent','Late'] %}<label><input type="radio" name="attendance_{{s.id}}" value="{{x}}" {% if existing_attendance.get(s.id,'Present')==x %}checked{% endif %}>{{x}}</label>{% endfor %}</span></div>{% endfor %}<button class="btn">Save Attendance</button></form></div>{% endif %}{% endblock %}
